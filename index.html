<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog & Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
    <script src="index.js" defer></script>
</head>
<body>

    <!-- Digital Clock Main Container  -->
    <main class="app-container">

        <!-- Navigation Bar -->
        <header class="navbar">

            <div class="nav-logo">
                <img src="assets/logo.png" alt="Clock Logo" width="20" height="20">
                <span>H4mblee Clock</span>
            </div>

            <div class="search-bar">
                <span class="search-icon material-symbols-outlined">search</span>
                <input type="search" class="search-input" id="search-value" placeholder="Search">
                <ul class="suggestion-list" id="suggestion"></ul>
            </div>

            <div class="nav-buttons">
                <button class="btn-logIn" type="button">Log In</button>
                <button class="btn-getApp" type="button">Download</button>
            </div>

        </header>

        <!-- Live Clock Section -->
        <section class="clock-live-section">

            <div class="time-display" id="timeDisplay"></div>

            <div class="clock-row">

                <div class="current-tag">Current</div>

                <div class="date-info">
                    <div id="daylight-time">Sun ☀️: 07:12 - 17:17 (10h 06m)</div>

                    <div id="date-time">Friday, October 16, 2026</div>
                </div>

                <div class="clock-format-toggle">

                    <button type="button" class="toggle-btn active" id="btn-12hr">12h</button>
                    <button type="button" class="toggle-btn" id="btn-24hr">24h</button>

                </div>

            </div>

        </section>

        <!-- Current City Time Section -->
        <section class="current-city">
            <div class="city-headline-row">
                <div>
                    <h1 class="title-city" id="currentCityTitle"></h1>
                </div>
                
                <div>
                    <p class="quotes" id="tagline">Life moves fast. Stay on time <br> and enjoy every moment!</p>
                </div>
                
                <button type="button" class="add-btnCities">
                    Add Another City 
                </button>

            </div>

            <!-- Automatically generated by Javascript -->
            <div class="random-cities" id="randomCities"></div>
        </section>
    </main>
</body>
</html>
